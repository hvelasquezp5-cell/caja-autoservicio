# Servicio de inferencia: una réplica en cada nodo del clúster (Pi 400 y worker Debian).
# hostPort 8001 hace que cada réplica responda en la IP de su nodo (192.168.100.X:8001),
# así la caja puede revisar la salud de cada nodo y pasar al otro en cuanto uno se cae.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: inferencia
  labels:
    app: inferencia
spec:
  selector:
    matchLabels:
      app: inferencia
  template:
    metadata:
      labels:
        app: inferencia
    spec:
      tolerations:
        # permite que también corra en el master aunque tenga el taint de control-plane
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: inferencia
          image: caja/inferencia:1
          imagePullPolicy: Never # la imagen se importa a mano en cada nodo; no hace falta internet
          ports:
            - containerPort: 8001
              hostPort: 8001
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: IMGSZ
              value: "320"
            - name: CONF
              value: "0.5"
          volumeMounts:
            - name: modelos
              mountPath: /modelos
              readOnly: true
          readinessProbe:
            httpGet:
              path: /salud
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /salud
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: modelos
          hostPath:
            path: /opt/caja/modelos
            type: Directory
---
# Acceso alternativo balanceado por K3s: http://<IP de cualquier nodo>:30081
apiVersion: v1
kind: Service
metadata:
  name: inferencia
spec:
  type: NodePort
  selector:
    app: inferencia
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30081
